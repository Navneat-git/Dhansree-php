; ==============================================================================
; Dhansree PHP-FPM Pool Configuration (AWS Lightsail - 2GB RAM / 2 vCPUs)
; Place at: /etc/php/8.3/fpm/pool.d/www.conf
; ==============================================================================

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager: Dynamic tuning to prevent OOM on 2GB RAM
; Total RAM: 2048 MB
; Reserved for OS + Nginx + Redis/Supervisor: ~400 MB
; Reserved for MySQL (InnoDB buffer pool): ~500 MB
; Remaining for PHP-FPM: ~1148 MB
; Avg worker size: ~60 MB
; 1148 / 60 ≈ 19 max theoretical -> safely set max_children to 12
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers after 1000 requests to avoid any PHP memory fragmentation
pm.max_requests = 1000

; Idle worker timeout
pm.process_idle_timeout = 10s

; Execution limits
request_terminate_timeout = 60s
rlimit_files = 65535

; PHP settings per worker
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 60
php_admin_value[date.timezone] = "Asia/Kolkata"
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.save_comments] = 1
