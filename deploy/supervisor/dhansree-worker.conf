[program:dhansree-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.3 /home/administrator/nodegny/Dhansree-php/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=administrator
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dhansree-worker.log
stopwaitsecs=3600
