# ==============================================================================
# Configuration File: country-allowlist.conf
# Component: Apache mod_maxminddb + mod_rewrite Country Filtering Engine
# Path: /etc/apache2/waf/country-allowlist.conf
# ==============================================================================

<IfModule mod_maxminddb.c>
    # --------------------------------------------------------------------------
    # 1. MaxMind DB Engine Initialization
    # --------------------------------------------------------------------------
    MaxMindDBEnable On
    MaxMindDBFile COUNTRY_DB /var/lib/GeoIP/GeoLite2-Country.mmdb

    # Export ISO 3166-1 2-letter Country Code to environment variable MM_COUNTRY_CODE
    MaxMindDBEnv MM_COUNTRY_CODE COUNTRY_DB/country/iso_code
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # --------------------------------------------------------------------------
    # 2. Localhost & Private Subnet Whitelist
    # --------------------------------------------------------------------------
    # Ensures loopback and AWS Lightsail internal IPs are NEVER blocked.
    RewriteCond %{REMOTE_ADDR} ^(127\.0\.0\.1|::1)$ [OR]
    RewriteCond %{REMOTE_ADDR} ^172\.(1[6-9]|2[0-9]|3[0-1])\. [OR]
    RewriteCond %{REMOTE_ADDR} ^10\. [OR]
    RewriteCond %{REMOTE_ADDR} ^192\.168\.
    RewriteRule ^ - [E=GEO_ALLOW:1]

    # --------------------------------------------------------------------------
    # 3. Essential Payment Gateways, Webhooks & APIs Whitelist
    # --------------------------------------------------------------------------
    # Payment callbacks and webhooks (Razorpay, PhonePe, Cashfree, Paytm, etc.)
    # may originate from cloud IPs outside the customer's country.
    RewriteCond %{REQUEST_URI} ^/(api/payment|api/webhook|payment/callback|webhook|track-order|order/status|checkout) [NC]
    RewriteRule ^ - [E=GEO_ALLOW:1]

    # --------------------------------------------------------------------------
    # 4. Verified Search Engine Crawlers & Monitoring Services
    # --------------------------------------------------------------------------
    # Allow legitimate bots (Googlebot, Bingbot, UptimeRobot, etc.)
    RewriteCond %{HTTP_USER_AGENT} (googlebot|bingbot|yandex|duckduckbot|slurp|baiduspider|uptimerobot) [NC]
    RewriteRule ^ - [E=GEO_ALLOW:1]

    # --------------------------------------------------------------------------
    # 5. Approved Country Allowlist
    # --------------------------------------------------------------------------
    # Specify allowed 2-letter ISO country codes separated by pipe (|).
    # Examples:
    #   Only India:                     ^(IN)$
    #   India, USA, and UK:             ^(IN|US|GB)$
    #   India, UAE, Canada, Australia:  ^(IN|AE|CA|AU)$
    RewriteCond %{ENV:MM_COUNTRY_CODE} ^(IN)$
    RewriteRule ^ - [E=GEO_ALLOW:1]

    # --------------------------------------------------------------------------
    # 6. Handling for Unknown / Unclassified IP Addresses
    # --------------------------------------------------------------------------
    # When MaxMind cannot classify an IP (e.g. private test network, new subnet):
    #   To ALLOW unknown IPs:  Leave rule below uncommented (default safe mode).
    #   To BLOCK unknown IPs:  Comment out the rule below with a '#'.
    RewriteCond %{ENV:MM_COUNTRY_CODE} ^$
    RewriteRule ^ - [E=GEO_ALLOW:1]

    # --------------------------------------------------------------------------
    # 7. Enforcement Action for Unapproved Countries
    # --------------------------------------------------------------------------
    # If the request did NOT match any of the above allow criteria (GEO_ALLOW != 1):
    # Deny with HTTP 403 Forbidden.
    RewriteCond %{ENV:GEO_ALLOW} !^1$
    RewriteRule ^ - [F,L]
</IfModule>
